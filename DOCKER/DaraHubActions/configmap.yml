apiVersion: v1
kind: ConfigMap
metadata:
  name: datahub-actions-config
  namespace: datahub1
data:
  federateAction.yml: |
    name: "DataHub Federation Ingestion Action"
    source:
      type: "kafka"
      config:
        connection:
          bootstrap: "prerequisites-kafka:9092"
          schema_registry_url: "http://datahub-datahub-gms:8080/schema-registry/api/"

    action:
      type: "ingestion"
      config:
        server_url: "http://loclahost:8080"
